        <tech id="api-design" category="backend" proficiency="9" years="15" tags="architecture"/>
        <tech id="full-stack" category="backend" proficiency="9" years="15" tags="specialty"/>
        <tech id="spatial-computing" category="data" proficiency="7" years="8" tags="gis,specialty"/>
        <tech id="game-dev" category="3d" proficiency="4" years="2" tags="specialty"/>
      </technologies>
    </metadata>
  </g>

