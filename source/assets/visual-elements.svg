<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" class="visual-elements-library">
  <defs>
    <!-- Color Palette -->
    <style>
      .tech-bubble { transition: all 0.2s ease; }
      .tech-bubble:hover { filter: brightness(1.2); }
      .tech-label { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 500; }
      .category-label { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
      
      /* Category Colors */
      .cat-frontend { fill: #3498db; }
      .cat-backend { fill: #e74c3c; }
      .cat-devops { fill: #f39c12; }
      .cat-data { fill: #9b59b6; }
      .cat-3d { fill: #e91e63; }
      .cat-tools { fill: #795548; }
      .cat-cloud { fill: #1abc9c; }
      .cat-database { fill: #16a085; }
      
      /* Proficiency Opacity */
      .prof-9 { opacity: 1.0; }
      .prof-8 { opacity: 0.95; }
      .prof-7 { opacity: 0.85; }
      .prof-6 { opacity: 0.75; }
      .prof-5 { opacity: 0.65; }
      .prof-4 { opacity: 0.55; }
    </style>

    <!-- Symbol Definitions for Reuse -->
    <symbol id="skill-bubble" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="45" class="tech-bubble" stroke="#fff" stroke-width="2"/>
      <circle cx="50" cy="50" r="40" class="tech-bubble" stroke-dasharray="251.2" stroke="#fff" stroke-width="1" fill="none" opacity="0.3"/>
    </symbol>

    <symbol id="tag-badge" viewBox="0 0 80 24">
      <rect x="2" y="2" width="76" height="20" rx="10" fill="#f0f0f0" stroke="#ddd" stroke-width="1"/>
      <text x="40" y="16" text-anchor="middle" class="tech-label" fill="#333"/>
    </symbol>
  </defs>

  <!-- Master Index (for CSS/JS querying) -->
  <g id="index" style="display: none">
    <metadata>
      <technologies>
        <!-- Backend: Ruby, Rust, Python, PHP, C# -->
        <tech id="ruby" category="backend" proficiency="9" years="15" tags="language"/>
        <tech id="ruby-on-rails" category="backend" proficiency="9" years="15" tags="framework"/>
        <tech id="rust" category="backend" proficiency="6" years="3" tags="language"/>
        <tech id="python" category="backend" proficiency="6" years="5" tags="language"/>
        <tech id="php" category="backend" proficiency="6" years="10" tags="language"/>
        <tech id="csharp" category="backend" proficiency="6" years="3" tags="language"/>
        
        <!-- Frontend: JavaScript, TypeScript, Vue, React, Svelte, HTML/CSS, SASS -->
        <tech id="javascript" category="frontend" proficiency="9" years="15" tags="language"/>
        <tech id="typescript" category="frontend" proficiency="7" years="5" tags="language"/>
        <tech id="vue" category="frontend" proficiency="7" years="5" tags="framework"/>
        <tech id="react" category="frontend" proficiency="7" years="5" tags="framework"/>
        <tech id="svelte" category="frontend" proficiency="5" years="1" tags="framework"/>
        <tech id="html-css" category="frontend" proficiency="9" years="20" tags="language"/>
        <tech id="sass-scss" category="frontend" proficiency="8" years="10" tags="tool"/>
        <tech id="d3js" category="frontend" proficiency="6" years="3" tags="visualization"/>
        
        <!-- Database: PostgreSQL, MySQL, PostGIS -->
        <tech id="postgresql" category="database" proficiency="9" years="15" tags="sql"/>
        <tech id="mysql" category="database" proficiency="8" years="15" tags="sql"/>
        <tech id="postgis" category="database" proficiency="7" years="8" tags="spatial,sql"/>
        
        <!-- Data: Redis, Elasticsearch -->
        <tech id="redis" category="data" proficiency="7" years="8" tags="cache,nosql"/>
        <tech id="elasticsearch" category="data" proficiency="6" years="5" tags="search,nosql"/>
        
        <!-- DevOps: Docker, Kubernetes, Terraform, Git, Linux -->
        <tech id="docker" category="devops" proficiency="7" years="6" tags="container"/>
        <tech id="kubernetes" category="devops" proficiency="5" years="2" tags="orchestration"/>
        <tech id="terraform" category="devops" proficiency="5" years="2" tags="iac"/>
        <tech id="git" category="devops" proficiency="9" years="15" tags="vcs"/>
        <tech id="linux" category="devops" proficiency="8" years="20" tags="sysadmin"/>
        
