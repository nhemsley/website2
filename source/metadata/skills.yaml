# Proficiency Scale
# 10 = Expert (can teach, architect systems, debug anything)
# 9 = Advanced (production experience, best practices)
# 8 = Proficient (comfortable with complex tasks)
# 7 = Competent (can work independently)
# 6 = Intermediate (needs occasional guidance)
# 5 = Basic (learning, can handle simple tasks)
# 4 = Beginner (exploring, needs support)
# 3 = Novice (just started)
